services:
  quant-distill:
    build:
      context: .
    environment:
      API_LISTEN_ADDRESS: "0.0.0.0"
      API_PORT: "8021"
      LOG_LEVEL: "INFO"

      # Ollama OpenAI-compatible endpoint (use service DNS, not localhost)
      LLM_BASE_URL: "http://ollama:11434/v1/chat/completions"
      LLM_MODEL: "llama3.1"
      LLM_API_KEY: ""
      LLM_TIMEOUT: "60"
      LLM_MAX_TOKENS: "4096"
      LLM_JSON_MODE: "true"
      LLM_NUM_CTX: "16384"

      DISTILL_PROMPT_VERSION: "v1"
      SENTIMENT_PROMPT_VERSION: "v1"
      ENTITY_PROMPT_VERSION: "v1"
      DISTILL_MAX_CHUNK_CHARS: "12000"

      # quant_sentiment delivery API
      SENTIMENT_API_URL: "http://quant-sentiment:8017/sentiment"
      SENTIMENT_API_KEY: ""
      SENTIMENT_TIMEOUT: "30"
      SENTIMENT_REQUIRED: "false"

      # quant_signals watchlist delivery API
      SIGNALS_API_URL: "http://quant-signals:8016/signals"
      SIGNALS_API_KEY: ""
      SIGNALS_TIMEOUT: "30"
      SIGNALS_REQUIRED: "false"

      # Shared PostgreSQL database; apply migrations before starting the service.
      DATABASE_URL: "postgresql+psycopg://quant_distill:quant_distill@postgres:5432/quant"

      HTTP_RETRIES: "3"
      RETRY_BACKOFF: "1.0"
      MAX_PAGE_SIZE: "100"
    ports:
      - "8021:8021"
    restart: unless-stopped
